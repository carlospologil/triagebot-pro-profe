<section id="panel-asignacion" class="tarjeta panel">
  <h2>Asignación</h2>
  <p>{% if asignado %}{{ asignado.nombre }}{% if asignado_inactivo %} <span class="tenue">(desactivado)</span>{% endif %}{% else %}<span class="tenue">Sin asignar</span>{% endif %}</p>
  {% if errores.asignacion %}<p class="alerta alerta-error" role="alert">{{ errores.asignacion }}</p>{% endif %}
  <form method="post" action="/tickets/{{ t.id }}/asignacion" class="form-panel"
        hx-post="/tickets/{{ t.id }}/asignacion" hx-target="#panel-asignacion" hx-swap="outerHTML">
    {{ csrf_campo() }}
    <label for="asignado_a">Asignar a</label>
    <select id="asignado_a" name="asignado_a">
      <option value=""{% if not t.asignado_a %} selected{% endif %}>Sin asignar</option>
      {% if asignado_inactivo %}<option value="{{ asignado.id }}" selected disabled>{{ asignado.nombre }} (desactivado)</option>{% endif %}
      {% for a in agentes %}
      <option value="{{ a.id }}"{% if t.asignado_a == a.id %} selected{% endif %}>{{ a.nombre }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="boton">Guardar asignación</button>
  </form>
  {% if t.asignado_a != usuario.id %}
  <form method="post" action="/tickets/{{ t.id }}/asignacion" class="form-panel"
        hx-post="/tickets/{{ t.id }}/asignacion" hx-target="#panel-asignacion" hx-swap="outerHTML">
    {{ csrf_campo() }}
    <input type="hidden" name="asignado_a" value="{{ usuario.id }}">
    <button type="submit" class="boton boton-secundario">Asignarme</button>
  </form>
  {% endif %}
</section>
