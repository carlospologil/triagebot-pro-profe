<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% block htmx_config %}<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>{% endblock %}
  <title>{% block titulo %}TriageBot Pro{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilos.css">
  {% block scripts %}<script src="https://unpkg.com/htmx.org@2.0.4" defer></script>{% endblock %}
</head>
<body class="{% block clase_body %}{% endblock %}" hx-headers='{"X-CSRF-Token": "{{ csrf_token() }}"}'>
  {% block cuerpo %}{% endblock %}
</body>
</html>
