<section id="panel-estado" class="tarjeta panel">
  <h2>Estado</h2>
  <p><span class="etiqueta etiqueta-estado-{{ t.estado }}">{{ etiquetas_estado.get(t.estado, t.estado) }}</span></p>
  {% if errores.estado %}<p class="alerta alerta-error" role="alert">{{ errores.estado }}</p>{% endif %}
  <form method="post" action="/tickets/{{ t.id }}/estado" class="form-panel"
        hx-post="/tickets/{{ t.id }}/estado" hx-target="#panel-estado" hx-swap="outerHTML">
    <label for="estado">Cambiar a</label>
    <select id="estado" name="estado">
      {% for e in siguientes %}<option value="{{ e }}">{{ etiquetas_estado.get(e, e) }}</option>{% endfor %}
    </select>
    <button type="submit" class="boton">Cambiar estado</button>
  </form>
</section>
